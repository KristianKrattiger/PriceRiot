          sku: 26          # Rodeo Rope ($18.99, pop 0.45)
          on_shelf_qty: 12
        # Bay 2 — Leather goods
        - bay: 2
          face: 0
          slot: 0
          sku: 28          # Leather Saddlebag ($59.99, pop 0.45)
          on_shelf_qty: 8
        - bay: 2
          face: 1
          slot: 0
          sku: 30          # Leather Journal ($14.99, pop 0.50)
          on_shelf_qty: 15
      right_side:
        bay_count: 1
        face_count: 2
        planogram:
        # Apparel + accessories (low-frequency, back of store)
        - bay: 0
          face: 0
