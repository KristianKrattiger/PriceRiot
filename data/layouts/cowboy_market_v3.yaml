# =============================================================================
# v3 PLANOGRAM — "Food Forward"
#
# Key differences vs v2:
#   Edge 4 (south side aisle):  Western Apparel (Cowboy Hat, Boots, Belt, Vest)
#                               replaces Ranch Supplies
#   Edge 5 (center aisle):      All top-popularity Cowboy Food on left side;
#                               mid-tier food + Work Gloves on right side
#   Edge 6 (north side aisle):  Ranch Supplies + Rodeo/Leather consolidated here
#
# Hypothesis: concentrating high-popularity food in the most-trafficked center
# aisle (edge 5) should lift food category unit sales vs v2's mixed placement.
# =============================================================================
planogram:
  edges:
    # ------------------------------------------------------------------
    # Edge 4  (node 2 → 5, south side aisle)
    # v2: only right_side with Ranch Supplies (lasso rope + horse feed)
    # v3: Western Apparel on BOTH sides — high-ticket impulse buys
    # ------------------------------------------------------------------
    '4':
      left_side:
        bay_count: 2
        face_count: 1
        planogram:
        # Cowboy Hat (sku 19, $34.99, pop 0.80) — premium placement
        - bay: 0
          face: 0
          slot: 0
          sku: 19
          on_shelf_qty: 10
        # Cowboy Boots (sku 20, $89.99, pop 0.70)
        - bay: 1
          face: 0
          slot: 0
          sku: 20
          on_shelf_qty: 8
      right_side:
        bay_count: 2
        face_count: 1
        planogram:
        # Leather Belt (sku 23, $19.99, pop 0.55)
        - bay: 0
          face: 0
          slot: 0
          sku: 23
          on_shelf_qty: 15
        # Denim Vest (sku 24, $39.99, pop 0.50)
        - bay: 1
          face: 0
          slot: 0
          sku: 24
          on_shelf_qty: 10
    # ------------------------------------------------------------------
    # Edge 5  (node 3 → 6, center aisle — highest expected foot traffic)
    # v2: food + ranch mixed (sku 14, 2, 4, 8, 16)
    # v3: pure Cowboy Food on left; mid-tier food + ranch staple on right
    # ------------------------------------------------------------------
    '5':
      left_side:
        bay_count: 3
        face_count: 2
        planogram:
        # Bay 0 — highest popularity food at aisle entrance
        - bay: 0
          face: 0
          slot: 0
          sku: 4           # Trail Beef Jerky ($5.99, pop 0.85)
          on_shelf_qty: 25
        - bay: 0
          face: 0
          slot: 1
          sku: 3           # Smoky BBQ Sauce ($4.49, pop 0.80)
          on_shelf_qty: 20
        - bay: 0
          face: 1
          slot: 0
          sku: 1           # Chuckwagon Beans ($2.99, pop 0.75)
          on_shelf_qty: 25
        # Bay 1 — mid-popularity food
        - bay: 1
          face: 0
          slot: 0
          sku: 2           # Campfire Chili ($3.99, pop 0.70)
          on_shelf_qty: 20
        - bay: 1
          face: 1
          slot: 0
          sku: 10          # Smoked Sausage Links ($8.99, pop 0.70)
          on_shelf_qty: 15
        # Bay 2 — specialty food
        - bay: 2
          face: 0
          slot: 0
          sku: 6           # Campfire Coffee ($7.99, pop 0.60)
          on_shelf_qty: 15
        - bay: 2
          face: 1
          slot: 0
          sku: 9           # Dried Apple Slices ($4.99, pop 0.60)
          on_shelf_qty: 15
      right_side:
        bay_count: 3
        face_count: 2
        planogram:
        # Bay 0 — remaining food items
        - bay: 0
          face: 0
          slot: 0
          sku: 5           # Cornbread Mix ($3.49, pop 0.65)
          on_shelf_qty: 20
        - bay: 0
          face: 1
          slot: 0
          sku: 7           # Prairie Honey ($6.49, pop 0.55)
          on_shelf_qty: 15
        - bay: 0
          face: 0
          slot: 1
          sku: 8           # Hardtack Biscuits ($2.49, pop 0.50)
          on_shelf_qty: 20
        # Bay 1 — Ranch staple (cross-sell adjacent to food)
        - bay: 1
          face: 0
          slot: 0
          sku: 14          # Work Gloves ($6.99, pop 0.75)
          on_shelf_qty: 20
        - bay: 1
          face: 1
          slot: 0
          sku: 11          # Lasso Rope ($14.99, pop 0.65)
          on_shelf_qty: 10
        # Bay 2 — Ranch staple continued
        - bay: 2
          face: 0
          slot: 0
          sku: 13          # Saddle Oil ($9.99, pop 0.55)
          on_shelf_qty: 15
        - bay: 2
          face: 1
          slot: 0
          sku: 16          # Hay Bale Twine ($5.99, pop 0.50)
          on_shelf_qty: 20
    # ------------------------------------------------------------------
    # Edge 6  (node 4 → 8, north side aisle)
    # v2: Ranch Supplies + Rodeo/Leather/Apparel mixed
    # v3: Ranch Supplies + Rodeo/Leather consolidated — lower-frequency
    #     specialty buys grouped together
    # ------------------------------------------------------------------
    '6':
      left_side:
        bay_count: 3
        face_count: 2
        planogram:
        # Bay 0 — Ranch hardware
        - bay: 0
          face: 0
          slot: 0
          sku: 12          # Horse Feed Sack ($19.99, pop 0.50)
          on_shelf_qty: 10
        - bay: 0
